# Put this inside the HTTPS server block that serves the "Смотрю" frontend.
# It exposes Supabase under the same origin as the app, so the browser only
# connects to your domain and never directly to xzaryhtrzdjrrqgrowkv.supabase.co.

# Add once at the http{} level in nginx.conf:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

location /supabase/ {
    proxy_pass https://xzaryhtrzdjrrqgrowkv.supabase.co/;
    proxy_ssl_server_name on;
    proxy_ssl_name xzaryhtrzdjrrqgrowkv.supabase.co;

    proxy_http_version 1.1;
    proxy_set_header Host xzaryhtrzdjrrqgrowkv.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
