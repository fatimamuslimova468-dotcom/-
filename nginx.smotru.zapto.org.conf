# Nginx для https://smotru.zapto.org
# Вставь location /supabase/ внутрь существующего server {} этого домена.
# Сам сайт при этом продолжает обслуживаться твоим обычным root/proxy.

# Добавь ОДИН раз в секцию http{} основного nginx.conf:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

location /supabase/ {
    # Конечный / в proxy_pass убирает префикс /supabase/.
    proxy_pass https://xzaryhtrzdjrrqgrowkv.supabase.co/;

    proxy_ssl_server_name on;
    proxy_ssl_name xzaryhtrzdjrrqgrowkv.supabase.co;

    proxy_http_version 1.1;
    proxy_set_header Host xzaryhtrzdjrrqgrowkv.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Нужны для Supabase Realtime WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Видео/загрузки и длинные запросы.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2G;
}
